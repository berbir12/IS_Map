<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="ismap-grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b60" />
      <stop offset="50%" stop-color="#ee654d" />
      <stop offset="100%" stop-color="#d4432b" />
    </linearGradient>
    <linearGradient id="ismap-grad-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffe4de" stop-opacity="0.3" />
    </linearGradient>
    <filter id="ismap-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#ee654d" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle with subtle gradient & shadow -->
  <rect x="6" y="6" width="88" height="88" rx="26" fill="url(#ismap-grad-bg)" filter="url(#ismap-shadow)" />

  <!-- Inner sleek rim -->
  <rect x="7" y="7" width="86" height="86" rx="25" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- Concentric Radar / Speed Waves -->
  <path d="M 24 64 A 36 36 0 0 1 76 64" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 33 56 A 23 23 0 0 1 67 56" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="5" stroke-linecap="round" />
  <path d="M 42 48 A 10 10 0 0 1 58 48" fill="none" stroke="rgba(255,255,255,0.95)" stroke-width="5.5" stroke-linecap="round" />

  <!-- Speed Lightning / Node Beacon Core -->
  <circle cx="50" cy="40" r="4.5" fill="#ffffff" />
  
  <!-- Dynamic Speed Arrow / Compass Pointer -->
  <path d="M 50 35 L 50 68" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 42 61 L 50 69 L 58 61" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Pulse Accent Dots -->
  <circle cx="24" cy="64" r="2.5" fill="rgba(255,255,255,0.7)" />
  <circle cx="76" cy="64" r="2.5" fill="rgba(255,255,255,0.7)" />
</svg>
